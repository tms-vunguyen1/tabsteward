<!doctype html><html><head><meta charset=utf-8><title>Browser Lab</title>
<style>body{font:16px system-ui;margin:24px;background:#fff;color:#111}section{margin:10px 0}#hov:hover{background:gold}#tall{height:3000px}.box{width:120px;height:40px;border:1px solid #888;display:inline-block}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script></head><body>
<h2>Browser Lab</h2>
<section><button id=btn>normal</button> <button id=trusted>trusted only</button> <span id=hov>hover me</span></section>
<section><input type=password id=pw value=secret123><input id=plain placeholder=plain> <span id=keys></span></section>
<section id=reactroot></section>
<section><div id=ce contenteditable style="border:1px solid #888;min-height:24px"></div></section>
<section><select id=sel><option>a<option>b</select> <input type=checkbox id=chk> <input type=date id=dt></section>
<section><input type=file id=file> <span id=fileout></span></section>
<section><div class=box id=drag draggable=true>drag</div> <div class=box id=drop>drop</div></section>
<section id=sh1></section><section id=sh2></section>
<section><iframe id=same src="/frame.html" height=50></iframe><iframe id=cross src="http://127.0.0.1:8766/frame.html" height=50></iframe></section>
<div id=tall></div>
<script>
window.pageSecret='s3';const __o={};const L=new Proxy(__o,{set(t,k,v){t[k]=v;document.documentElement.dataset.log=JSON.stringify(t);return true}});
btn.onclick=e=>{L.btn={trusted:e.isTrusted}};
trusted.onclick=e=>{L.trustedOnly=e.isTrusted?'ACCEPTED':'REJECTED'};
plain.addEventListener('keydown',e=>{L.key={key:e.key,trusted:e.isTrusted}});
file.onchange=async()=>{L.file={name:file.files[0].name,text:await file.files[0].text()}};
drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();L.drop=e.dataTransfer?e.dataTransfer.getData('text')||'dropped':'dropped'};
drag.ondragstart=e=>e.dataTransfer.setData('text','payload');
sh1.attachShadow({mode:'open'}).innerHTML='<button id=sb>open shadow</button>';
sh1.shadowRoot.getElementById('sb').onclick=()=>{L.shadowOpen=true};
sh2.attachShadow({mode:'closed'}).innerHTML='<button>closed shadow</button>';
function App(){const[v,s]=React.useState('');return React.createElement('div',null,React.createElement('input',{id:'rinput',value:v,onChange:e=>s(e.target.value),placeholder:'react'}),React.createElement('b',{id:'rout'},v))}
ReactDOM.createRoot(reactroot).render(React.createElement(App));
</script></body></html>
